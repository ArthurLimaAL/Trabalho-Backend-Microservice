# ============================================================
# DOCKER COMPOSE - Pagamento Service
# ============================================================
# Subir localmente com: docker compose up --build
# 
# 🔐 SEGURANÇA NO DOCKER:
# - Variáveis sensíveis via .env (não hardcoded aqui)
# - Healthcheck para garantir que o serviço está pronto
# - Network isolation: serviços se comunicam via nome, não IPs
# ============================================================

services:
  # ==========================================
  # BANCO DE DADOS POSTGRESQL
  # ==========================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment_dev_password}
      POSTGRES_DB: payment_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - payment-network

  # ==========================================
  # SERVIÇO DE PAGAMENTO
  # ==========================================
  payment:
    build: .
    environment:
      PORT: 3001
      DATABASE_URL: postgres://payment:${POSTGRES_PASSWORD:-payment_dev_password}@db:5432/payment_service
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_env_refresh}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
      COMMISSION_RATE: "0.12"
      SERVICE_FEE_CENTS: "150"
      PAYMENT_TIMEOUT_MS: "300000"
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    command: sh -c "npm run migrate && npm start"
    restart: on-failure
    networks:
      - payment-network

  # Observação de segurança: para fail-closed em produção, rode:
  # docker compose up --abort-on-container-exit
  # Isso encerra todos os serviços quando qualquer um sai por falha.

  # ==========================================
  # NOTIFICATION SERVICE
  # ==========================================
  notification:
    build: ./services/notification-service
    environment:
      PORT: 3004
      NODE_ENV: production
    ports:
      - "3004:3004"
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3004/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - payment-network

volumes:
  pgdata:

networks:
  payment-network:
    driver: bridge

# ============================================================
# PRODUIÇÃO - Docker Compose
# ============================================================
# Em produção, considere:
# - Usar Docker Swarm ou Kubernetes
# - Segrecs do Docker: docker secret create jwt_secret ./secrets/jwt.txt
# - Redes mais restritas
# - Sem portas mapeadas (apenas internal)
# - Logs centralizados (ELK, Loki)
# ============================================================